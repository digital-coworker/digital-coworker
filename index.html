<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL SHOOTER 2099</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0f;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace}
  #wrap{text-align:center}
  canvas{background:#000;border:2px solid #1e2a3a;box-shadow:0 0 40px #0ff3;image-rendering:pixelated}
  #hint{color:#4a5a6a;font-size:12px;margin-top:8px;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="640" height="800"></canvas>
  <div id="hint">ARROWS/WASD move · SPACE shoot · P pause · click to enable sound</div>
</div>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 80, H = 50, CW = cv.width / W, CH = cv.height / H;   // char grid
ctx.font = `${Math.floor(CH)}px monospace`; ctx.textBaseline = 'top';

/* ---------------- chiptune (WebAudio) ---------------- */
let AC = null, musicTimer = null, bpm = 96, step = 0;
const BASS = [0,0,7,0,3,3,10,3,5,5,12,5,3,3,10,7];
const ARP  = [12,15,19,24,19,15,12,15,19,24,27,24,19,15,12,7];
const ROOT = 55.0, freq = s => ROOT * Math.pow(2, s/12);
function note(f, t, dur, type, gain){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur);
}
function musicStep(){
  if(!AC) return;
  const six = 60/bpm/4, t = AC.currentTime + 0.05;
  note(freq(BASS[step]), t, six*0.9, 'square', 0.10);
  note(freq(ARP[step]),  t, six*0.8, 'square', 0.06);
  step = (step+1) % 16;
  musicTimer = setTimeout(musicStep, six*1000);
}
addEventListener('pointerdown', () => { if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); musicStep(); } }, {once:false});

/* ---------------- game state ---------------- */
let px, py, bullets, ebullets, enemies, powerups, booms, stars,
    score, lives, level, power, fireCd, tick, invuln, over, paused, started;
function reset(){
  px = W/2; py = H-4;
  bullets=[]; ebullets=[]; enemies=[]; powerups=[]; booms=[];
  stars = Array.from({length:70}, () => [Math.random()*W, Math.random()*H, '.*:'[Math.random()*3|0]]);
  score=0; lives=3; level=1; power=1; fireCd=0; tick=0; invuln=60; over=false; paused=false;
}
reset(); started=false;

const keys = {};
addEventListener('keydown', e => {
  keys[e.key.length===1 ? e.key.toLowerCase() : e.key] = true;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if(!started && e.key===' ') started = true;
  if(over && e.key.toLowerCase()==='r') reset();
});
addEventListener('keyup', e => { keys[e.key.length===1 ? e.key.toLowerCase() : e.key] = false; });

const PATTERNS = {
  1:[[0,-1.6,'|']],
  2:[[-0.5,-1.6,'|'],[0.5,-1.6,'|']],
  3:[[0,-1.8,'|'],[-0.6,-1.5,'/'],[0.6,-1.5,'\\']],
  4:[[-0.8,-1.7,'|'],[-0.3,-1.8,'|'],[0.3,-1.8,'|'],[0.8,-1.7,'|']],
  5:[[0,-2.0,'#'],[-0.9,-1.6,'/'],[-0.4,-1.8,'|'],[0.4,-1.8,'|'],[0.9,-1.6,'\\']]
};
function spawnEnemy(){
  const kind = Math.random() < Math.max(.1, .6-level*.04) ? 'dart' : (Math.random() < .5 ? 'weaver' : 'tank');
  const x = 2 + Math.random()*(W-4);
  if(kind==='dart')   enemies.push({x, y:0, vy:.35+level*.03, vx:0, ch:'v', hp:1, kind, col:'#f44', cd:40+Math.random()*80});
  else if(kind==='weaver') enemies.push({x, y:0, vy:.28+level*.02, vx:(Math.random()<.5?-1:1)*.4, ch:'W', hp:2, kind, col:'#f4f', cd:30+Math.random()*60});
  else enemies.push({x, y:0, vy:.18+level*.015, vx:0, ch:'M', hp:4+(level/2|0), kind, col:'#4f4', cd:20+Math.random()*40});
}
function shoot(){
  for(const [dx,vy,ch] of PATTERNS[Math.min(power,5)]) bullets.push([px+dx, py-1, vy, dx*.15, ch]);
  fireCd = Math.max(3, 8-power);
}
function hit(){
  lives--; power = Math.max(1, power-1); invuln = 90;
  booms.push([px, py, 8]);
  if(lives<=0) over = true;
}

function update(){
  tick++;
  fireCd = Math.max(0, fireCd-1); invuln = Math.max(0, invuln-1);
  const nl = 1 + (tick/450|0);
  if(nl !== level){ level = nl; bpm = Math.min(220, 96+(level-1)*9); powerups.push([2+Math.random()*(W-4), 0, 'P']); }
  if(tick % Math.max(6, 26-level*2) === 0 && enemies.length < 4+level*2) spawnEnemy();
  if(level>=3 && tick%900===0) powerups.push([2+Math.random()*(W-4),0,'P']);
  for(const s of stars){ s[1]+=.3+level*.04; if(s[1]>=H){s[0]=Math.random()*W;s[1]=0;} }
  if(keys['ArrowLeft']||keys['a']) px = Math.max(1, px-.5);
  if(keys['ArrowRight']||keys['d']) px = Math.min(W-2, px+.5);
  if(keys['ArrowUp']||keys['w']) py = Math.max(2, py-.5);
  if(keys['ArrowDown']||keys['s']) py = Math.min(H-2, py+.5);
  if(keys[' '] && fireCd<=0) shoot();
  for(const b of bullets.slice()){ b[1]+=b[2]; b[0]+=b[3]; if(b[1]<1||b[0]<0||b[0]>=W) bullets.splice(bullets.indexOf(b),1); }
  for(const e of enemies.slice()){
    e.y+=e.vy; e.x+=e.vx;
    if(e.x<1||e.x>W-2) e.vx*=-1;
    if(e.y>=H-1){ enemies.splice(enemies.indexOf(e),1); continue; }
    if(--e.cd<=0 && e.y<py-4){
      const sp=.5+level*.04, dx=px-e.x, dy=py-e.y, d=Math.max(1,Math.hypot(dx,dy));
      ebullets.push([e.x, e.y+1, dx/d*sp, dy/d*sp]);
      e.cd = 25+Math.random()*(140-level*5);
    }
  }
  for(const b of bullets.slice()) for(const e of enemies.slice()){
    if(Math.abs(b[0]-e.x)<1.2 && Math.abs(b[1]-e.y)<1){
      bullets.splice(bullets.indexOf(b),1); e.hp--;
      if(e.hp<=0){
        enemies.splice(enemies.indexOf(e),1); booms.push([e.x,e.y,6]);
        score += {dart:100,weaver:250,tank:500}[e.kind]*level;
        if(Math.random()<.12) powerups.push([e.x,e.y,'P']);
      }
      break;
    }
  }
  for(const b of ebullets.slice()){
    b[0]+=b[2]; b[1]+=b[3];
    if(b[1]>=H||b[0]<0||b[0]>=W){ ebullets.splice(ebullets.indexOf(b),1); continue; }
    if(!invuln && Math.abs(b[0]-px)<1.2 && Math.abs(b[1]-py)<1){ ebullets.splice(ebullets.indexOf(b),1); hit(); }
  }
  if(!invuln) for(const e of enemies.slice())
    if(Math.abs(e.x-px)<1.4 && Math.abs(e.y-py)<1.2){ enemies.splice(enemies.indexOf(e),1); booms.push([e.x,e.y,6]); hit(); break; }
  for(const p of powerups.slice()){
    p[1]+=.3;
    if(p[1]>=H){ powerups.splice(powerups.indexOf(p),1); continue; }
    if(Math.abs(p[0]-px)<1.4 && Math.abs(p[1]-py)<1.2){ powerups.splice(powerups.indexOf(p),1); power=Math.min(5,power+1); score+=50; }
  }
  for(const bo of booms.slice()) if(--bo[2]<=0) booms.splice(booms.indexOf(bo),1);
}

function put(x,y,ch,color){ ctx.fillStyle=color; ctx.fillText(ch, x*CW, y*CH); }
function center(y,msg,color){ ctx.fillStyle=color; const w=ctx.measureText(msg).width; ctx.fillText(msg,(cv.width-w)/2,y*CH); }
function draw(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);
  for(const s of stars){ ctx.globalAlpha=.4; put(s[0],s[1],s[2],'#8af'); ctx.globalAlpha=1; }
  for(const p of powerups) put(p[0],p[1],'P','#fff');
  ctx.fillStyle='#ff0';
  for(const b of bullets) put(b[0],b[1],b[4],'#ff0');
  for(const b of ebullets) put(b[0],b[1],'o','#f44');
  for(const e of enemies) put(e.x,e.y,e.ch,e.col);
  for(const bo of booms) put(bo[0],bo[1],'*#@%+'[Math.random()*5|0],'#f80');
  if(!(invuln && tick%4<2)) put(px-1,py,tick%12<6?'/^\\':'/=\\','#0ff');
  const hud = `SCORE ${String(score).padStart(7,'0')}  LV ${level}  PWR ${'▮'.repeat(power)}${'▯'.repeat(5-power)}  LIVES ${'♥'.repeat(Math.max(0,lives))}  ♪${bpm|0}bpm`;
  put(0,0,hud,'#fff');
}
function loop(){
  if(!started){
    draw();
    center(20,'▀█▀ TERMINAL SHOOTER 2099 ▀█▀','#0ff');
    center(23,'ARROWS/WASD move · SPACE shoot','#fff');
    center(25,'Grab P — 5 weapon tiers. SPACE to launch','#8af');
  } else if(over){
    draw(); center(22,'G A M E   O V E R','#f44'); center(25,`FINAL SCORE ${String(score).padStart(7,'0')}`,'#fff'); center(27,'R = restart','#8af');
  } else if(keys['p'] && tick%30<15){
    draw(); center(24,'PAUSED','#fff');
  } else { update(); draw(); }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
